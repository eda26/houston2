<!DOCTYPE html>
<html>
<head>
  <title>Houston Real Estate Market Analysis</title>
  <style>
    body {
      margin: 0;
      padding: 8px;
      background: #f0f0f0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0 10px 0;
      position: relative;
    }

    h1 {
      font-size: 18px;
      color: #333;
      margin: 0;
    }

    .author {
      font-size: 14px;
      color: #444;
      font-weight: normal;
      margin-left: 12px;
    }

    .toggle-btn {
      position: absolute;
      right: 0;
      padding: 6px 14px;
      background: #1a1a2e;
      color: #c8a97e;
      border: 1.5px solid #c8a97e;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .toggle-btn:hover {
      background: #c8a97e;
      color: #1a1a2e;
    }

    .container {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .dashboard {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    h3 {
      text-align: center;
      margin: 0 0 4px 0;
      font-size: 14px;
      color: #444;
    }

    iframe {
      width: 100%;
      height: 88vh;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      display: block;
    }

    .dashboard.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Houston Real Estate Market Analysis</h1>
    <span class="author">By Emilio Doporto</span>
    <button class="toggle-btn" id="toggleBtn" onclick="toggleIncome()">
      Show: Dashboard 4
    </button>
  </div>

  <div class="container">

    <!-- Dashboard 1 -->
    <div class="dashboard">
      <h3>Dashboard 1</h3>
      <iframe id="frame1"
        src="https://app.powerbi.com/view?r=eyJrIjoiZjhlYTQ5NGEtMjVjZS00ZGU2LWI4NGUtMTc3YTkzN2U5ZDBkIiwidCI6IjM0MDhhYWRhLWRjMTYtNDAyMy05NDNmLWRkNzMzNWU2NzliNyIsImMiOjR9&pageName=9281ea3244cc8217e777"
        allowFullScreen>
      </iframe>
    </div>

    <!-- Dashboard 2 -->
    <div class="dashboard">
      <h3>Dashboard 2</h3>
      <iframe id="frame2"
        src="https://app.powerbi.com/view?r=eyJrIjoiZjhlYTQ5NGEtMjVjZS00ZGU2LWI4NGUtMTc3YTkzN2U5ZDBkIiwidCI6IjM0MDhhYWRhLWRjMTYtNDAyMy05NDNmLWRkNzMzNWU2NzliNyIsImMiOjR9&pageName=d68dd286829a03b0324c"
        allowFullScreen>
      </iframe>
    </div>

    <!-- Dashboard 3 -->
    <div class="dashboard">
      <h3>Dashboard 3</h3>
      <iframe id="frame3"
        src="https://app.powerbi.com/view?r=eyJrIjoiZjhlYTQ5NGEtMjVjZS00ZGU2LWI4NGUtMTc3YTkzN2U5ZDBkIiwidCI6IjM0MDhhYWRhLWRjMTYtNDAyMy05NDNmLWRkNzMzNWU2NzliNyIsImMiOjR9&pageName=2809b533e4deb78027d9"
        allowFullScreen>
      </iframe>
    </div>

    <!-- Dashboard 4 -->
    <div class="dashboard hidden" id="dash4">
      <h3>Dashboard 4</h3>
      <iframe id="frame4"
        src="https://app.powerbi.com/view?r=eyJrIjoiZjhlYTQ5NGEtMjVjZS00ZGU2LWI4NGUtMTc3YTkzN2U5ZDBkIiwidCI6IjM0MDhhYWRhLWRjMTYtNDAyMy05NDNmLWRkNzMzNWU2NzliNyIsImMiOjR9&pageName=59bfd5c1193450804950"
        allowFullScreen>
      </iframe>
    </div>

  </div>

  <script>
    let incomeVisible = false;

    function toggleIncome() {
      incomeVisible = !incomeVisible;

      document
        .getElementById('dash4')
        .classList.toggle('hidden', !incomeVisible);

      document.getElementById('toggleBtn').textContent = incomeVisible
        ? 'Hide: Dashboard 4'
        : 'Show: Dashboard 4';
    }
  </script>

</body>
</html>
